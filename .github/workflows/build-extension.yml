name: Build Extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve version
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Explicit tag push: the tag is the version, always release.
            version="${GITHUB_REF#refs/tags/v}"
            release=true
          else
            # Otherwise the manifest is the source of truth, and we release
            # only when its version has no tag yet (i.e. the version was bumped).
            version=$(node -p "require('./dist/manifest.json').version")
            release=false
            if [[ "$GITHUB_REF" == refs/heads/main ]] &&
               ! git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
              release=true
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=profisee-health-check-v${version}" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $version (release: $release)"

      - name: Package extension
        run: |
          cd dist
          zip -r "../${{ steps.meta.outputs.name }}.zip" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: dist
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: steps.meta.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: v${{ steps.meta.outputs.version }}
          files: ${{ steps.meta.outputs.name }}.zip
          generate_release_notes: true
          body: |
            ## Install (Chrome developer mode)

            1. Download `${{ steps.meta.outputs.name }}.zip` below and unzip it.
            2. Open `chrome://extensions`.
            3. Turn on **Developer mode** (top right).
            4. Click **Load unpacked** and select the unzipped folder.
